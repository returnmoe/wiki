<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="title description">
  <title id="title">Kubernetes workload and Informational Ontology Framework comparison</title>
  <desc id="description">
    Two simple columns compare a Kubernetes Deployment and base image, controller, Pods, Nodes, and
    persistent storage with a character specification and base encodings, interpretive practices,
    informational-subject instantiations, physical substrates, and durable archives.
  </desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#57c7ef" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a99aff" />
    </marker>
  </defs>

  <rect width="1000" height="750" rx="24" fill="#0b1220" />
  <rect x="24" y="24" width="466" height="638" rx="18" fill="#111827" stroke="#386b86" stroke-width="2" />
  <rect x="510" y="24" width="466" height="638" rx="18" fill="#111827" stroke="#5f568d" stroke-width="2" />

  <text x="257" y="66" fill="#76d7f8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    Kubernetes workload
  </text>
  <text x="743" y="66" fill="#b4a8ff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
    Informational Ontology Framework
  </text>

  <g>
    <rect x="55" y="94" width="404" height="90" rx="12" fill="#18324b" stroke="#4f91b6" />
    <text x="78" y="130" fill="#f4f7fb" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="650">Deployment + base image</text>
    <text x="78" y="158" fill="#b9c7d9" font-family="Inter, Arial, sans-serif" font-size="16">desired state, image, configuration, data</text>

    <rect x="541" y="94" width="404" height="90" rx="12" fill="#18324b" stroke="#6577b8" />
    <text x="564" y="130" fill="#f4f7fb" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650">Character specification + encodings</text>
    <text x="564" y="158" fill="#b9c7d9" font-family="Inter, Arial, sans-serif" font-size="16">traits, behavior, history, works, prompts</text>
  </g>

  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M 257 184 L 257 220" stroke="#57c7ef" marker-end="url(#arrow-blue)" />
    <path d="M 743 184 L 743 220" stroke="#a99aff" marker-end="url(#arrow-purple)" />
  </g>

  <g>
    <rect x="97" y="228" width="320" height="72" rx="12" fill="#292650" stroke="#7167ae" />
    <text x="257" y="258" fill="#f4f7fb" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle">Controller + ReplicaSet</text>
    <text x="257" y="282" fill="#c6c1e3" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle">creates and replaces active Pods</text>

    <rect x="583" y="228" width="320" height="72" rx="12" fill="#292650" stroke="#7e71bc" />
    <text x="743" y="258" fill="#f4f7fb" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle">Interpretive practice</text>
    <text x="743" y="282" fill="#c6c1e3" font-family="Inter, Arial, sans-serif" font-size="15" text-anchor="middle">reads, performs, imagines, or enacts</text>
  </g>

  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M 257 300 L 257 325 L 158 325 L 158 347" stroke="#57c7ef" marker-end="url(#arrow-blue)" />
    <path d="M 257 325 L 356 325 L 356 347" stroke="#57c7ef" marker-end="url(#arrow-blue)" />
    <path d="M 743 300 L 743 325 L 644 325 L 644 347" stroke="#a99aff" marker-end="url(#arrow-purple)" />
    <path d="M 743 325 L 842 325 L 842 347" stroke="#a99aff" marker-end="url(#arrow-purple)" />
  </g>

  <g>
    <rect x="63" y="355" width="190" height="72" rx="12" fill="#123847" stroke="#4e91a4" />
    <text x="158" y="399" fill="#eefbff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle">Pod A</text>
    <rect x="261" y="355" width="190" height="72" rx="12" fill="#123847" stroke="#4e91a4" />
    <text x="356" y="399" fill="#eefbff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="middle">Pod B</text>

    <rect x="549" y="355" width="190" height="72" rx="12" fill="#123847" stroke="#568ca2" />
    <text x="644" y="388" fill="#eefbff" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="middle">Instantiation A</text>
    <text x="644" y="412" fill="#b5d4de" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle">reading or performance</text>
    <rect x="747" y="355" width="190" height="72" rx="12" fill="#123847" stroke="#568ca2" />
    <text x="842" y="388" fill="#eefbff" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="middle">Instantiation B</text>
    <text x="842" y="412" fill="#b5d4de" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle">interactive enactment</text>
  </g>

  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M 158 427 L 158 458" stroke="#57c7ef" marker-end="url(#arrow-blue)" />
    <path d="M 356 427 L 356 458" stroke="#57c7ef" marker-end="url(#arrow-blue)" />
    <path d="M 644 427 L 644 458" stroke="#a99aff" marker-end="url(#arrow-purple)" />
    <path d="M 842 427 L 842 458" stroke="#a99aff" marker-end="url(#arrow-purple)" />
  </g>

  <g>
    <rect x="63" y="466" width="190" height="66" rx="12" fill="#1e293b" stroke="#52637c" />
    <text x="158" y="507" fill="#eef2f8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="middle">Node X</text>
    <rect x="261" y="466" width="190" height="66" rx="12" fill="#1e293b" stroke="#52637c" />
    <text x="356" y="507" fill="#eef2f8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="middle">Node Y</text>

    <rect x="549" y="466" width="190" height="66" rx="12" fill="#1e293b" stroke="#58627c" />
    <text x="644" y="495" fill="#eef2f8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="middle">Human substrate</text>
    <text x="644" y="517" fill="#b4bfce" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle">body and brain</text>
    <rect x="747" y="466" width="190" height="66" rx="12" fill="#1e293b" stroke="#58627c" />
    <text x="842" y="495" fill="#eef2f8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="middle">Computer substrate</text>
    <text x="842" y="517" fill="#b4bfce" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle">hardware and runtime</text>
  </g>

  <g>
    <rect x="55" y="560" width="404" height="72" rx="12" fill="#3b3028" stroke="#876a47" />
    <text x="78" y="589" fill="#f3dcc0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">PersistentVolume</text>
    <text x="78" y="614" fill="#d4c2ad" font-family="Inter, Arial, sans-serif" font-size="15">durable state across successive Pods</text>

    <rect x="541" y="560" width="404" height="72" rx="12" fill="#3b3028" stroke="#876a47" />
    <text x="564" y="589" fill="#f3dcc0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">Durable memory and archives</text>
    <text x="564" y="614" fill="#d4c2ad" font-family="Inter, Arial, sans-serif" font-size="15">records that can inform later instantiations</text>
  </g>

  <rect x="55" y="688" width="890" height="40" rx="10" fill="#152338" stroke="#43617b" />
  <text x="500" y="714" fill="#c4d6e6" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">
    Dormancy: the maintained pattern remains available while active instances are at zero
  </text>
</svg>
